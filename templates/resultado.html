<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado del Anuncio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-3xl mx-auto bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 space-y-6">
        <h1 class="text-2xl font-bold text-blue-400 text-center">Estrategia y Anuncio Generado</h1>
        
        <div>
            <h2 class="text-lg font-semibold text-slate-300 mb-2">Producto: {{ producto }}</h2>
            <div class="bg-slate-700 p-4 rounded text-sm whitespace-pre-line leading-relaxed text-slate-200">
                {{ analisis }}
            </div>
        </div>

        {% if image_url %}
        <div>
            <h2 class="text-lg font-semibold text-slate-300 mb-2">Imagen Generada (FLUX):</h2>
            <img src="{{ image_url }}" alt="Anuncio Generado" class="w-full rounded-lg border border-slate-600 shadow">
        </div>
        {% endif %}

        <div class="text-center pt-4">
            <a href="/" class="inline-block bg-slate-700 hover:bg-slate-600 text-white px-6 py-2 rounded transition-colors">Volver a intentar</a>
        </div>
    </div>
</body>
</html>
