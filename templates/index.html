<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Anuncios IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
        <h1 class="text-2xl font-bold mb-4 text-center text-blue-400">Generador de Anuncios IA</h1>
        <p class="text-slate-300 mb-6 text-center text-sm">Ingresa los datos para analizar competidores y generar tu contenido publicitario.</p>
        <form action="/generar" method="post" class="space-y-4">
            <div>
                <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Nombre del Producto</label>
                <input type="text" name="producto" placeholder="Ej: Jabón Artesanal de Avena" class="w-full p-3 rounded bg-slate-700 border border-slate-600 focus:outline-none focus:border-blue-500 text-white" required>
            </div>
            <div>
                <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Descripción / Beneficios</label>
                <textarea name="descripcion" rows="3" placeholder="Ej: Hidratante natural, ideal para piel sensible..." class="w-full p-3 rounded bg-slate-700 border border-slate-600 focus:outline-none focus:border-blue-500 text-white" required></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded transition-colors">Generar Anuncio</button>
        </form>
    </div>
</body>
</html>
