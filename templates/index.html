<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdGenius IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold text-blue-400 mb-6 text-center">Generador de Anuncios IA</h1>
        <form id="adForm" class="bg-slate-800 p-6 rounded-lg space-y-4 shadow-lg mb-6">
            <div>
                <label class="block text-xs uppercase font-bold text-slate-300 mb-1">Tu Producto / Nombre / URL</label>
                <input type="text" id="producto" name="producto" required class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-white">
            </div>
            <div>
                <label class="block text-xs uppercase font-bold text-slate-300 mb-1">Descripción / Beneficios / URL Competidor</label>
                <textarea id="descripcion" name="descripcion" rows="3" required class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-white"></textarea>
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded text-white transition">Generar Anuncio</button>
        </form>

        <div id="status" class="hidden bg-slate-800 p-4 rounded text-blue-400 font-medium mb-6"></div>
        <div id="results" class="hidden space-y-6">
            <div id="analysis" class="bg-slate-800 p-6 rounded text-sm text-slate-300"></div>
            <div id="placas" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('adForm');
        const status = document.getElementById('status');
        const results = document.getElementById('results');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            status.innerText = 'Procesando...';
            status.classList.remove('hidden');
            results.classList.add('hidden');

            const response = await fetch('/generar', { method: 'POST', body: new FormData(form) });
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const payload = JSON.parse(line.replace('data: ', ''));
                        if (payload.stage === 'scraping') status.innerText = 'Scrapeando información...';
                        if (payload.stage === 'analisis') status.innerText = 'Analizando competencia...';
                        if (payload.stage === 'estrategia') status.innerText = 'Diseñando carrusel...';
                        if (payload.stage === 'complete') {
                            status.innerText = '¡Completado!';
                            render(payload.data);
                        }
                    }
                }
            }
        });

        function render(data) {
            results.classList.remove('hidden');
            document.getElementById('analysis').innerHTML = `
                <h3 class="font-bold text-lg text-white mb-2">Análisis de Competencia</h3>
                <p><strong>Oportunidad:</strong> ${data.analisis.oportunidad_clave}</p>
                <p><strong>Tono:</strong> ${data.analisis.tono_de_marca}</p>
            `;
            document.getElementById('placas').innerHTML = data.placas.map(p => `
                <div class="bg-slate-800 rounded overflow-hidden p-3 border border-slate-700">
                    ${p.image_url ? `<img src="${p.image_url}" class="w-full h-40 object-cover mb-2 rounded">` : ''}
                    <span class="text-xs bg-blue-900 text-blue-200 px-2 py-0.5 rounded uppercase font-bold">${p.tipo}</span>
                    <h4 class="font-bold text-white mt-1">${p.titulo}</h4>
                    <p class="text-xs text-slate-400 mt-1">${p.copy}</p>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
