<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdGenius - AI Marketing Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-grid { background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px); background-size: 24px 24px; }
        .skeleton { background: linear-gradient(90deg, #1f2937 25%, #374151 50%, #1f2937 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen bg-grid font-sans">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-500 mb-2">
                AdGenius AI
            </h1>
            <p class="text-gray-400">Inteligencia competitiva y creación de carruseles publicitarios HD</p>
        </header>

        <!-- Formulario -->
        <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-6 shadow-xl backdrop-blur-sm mb-10">
            <form id="analyzeForm" enctype="multipart/form-data" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Tu Negocio (URL o Nombre)</label>
                        <input type="text" name="business_url" required placeholder="ej. Jabones Artesanales Natura" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Competidor (URL o Nombre)</label>
                        <input type="text" name="competitor_url" required placeholder="ej. CompetidorDirecto.com" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-purple-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Enfoque / Ángulo (Opcional)</label>
                    <input type="text" name="angulo" placeholder="ej. Educativo, Oferta, Comparativa..." class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">📸 Fotos de tu producto (Opcional, para precisión visual HD)</label>
                    <input type="file" name="images" multiple accept="image/*" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-purple-600 file:text-white hover:file:bg-purple-700">
                </div>
                <button type="submit" id="btnSubmit" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                    <span>⚡ Generar Análisis y Carrusel HD</span>
                </button>
            </form>
        </div>

        <!-- Status Stream -->
        <div id="statusContainer" class="hidden bg-gray-900 border border-purple-500/30 rounded-xl p-4 mb-8">
            <div class="flex items-center gap-3">
                <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-purple-400"></div>
                <p id="statusText" class="text-purple-300 text-sm font-medium">Iniciando proceso...</p>
            </div>
        </div>

        <!-- Dashboard Result -->
        <div id="dashboard" class="hidden space-y-8">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                <h2 id="campaignTitle" class="text-2xl font-bold text-white mb-4">Campaña</h2>
                <div id="dashboardData" class="text-gray-300 space-y-2 text-sm"></div>
            </div>

            <!-- Carrusel Cards -->
            <h3 class="text-xl font-bold text-white">Placas del Carrusel (Desliza)</h3>
            <div id="carouselContainer" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('analyzeForm');
        const statusContainer = document.getElementById('statusContainer');
        const statusText = document.getElementById('statusText');
        const dashboard = document.getElementById('dashboard');
        const carouselContainer = document.getElementById('carouselContainer');
        const dashboardData = document.getElementById('dashboardData');
        const campaignTitle = document.getElementById('campaignTitle');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            
            statusContainer.classList.remove('hidden');
            dashboard.classList.add('hidden');
            carouselContainer.innerHTML = '';
            statusText.innerText = 'Iniciando generación...';

            const response = await fetch('/api/analyze', {
                method: 'POST',
                body: formData
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');

                for (const line of lines) {
                    if (line.startswith('data: ')) {
                        try {
                            const json = JSON.parse(line.replace('data: ', ''));
                            statusText.innerText = json.mensaje;

                            if (json.stage === 'estrategia' && json.status === 'done') {
                                dashboard.classList.remove('hidden');
                                campaignTitle.innerText = json.data.nombre_campana;
                                dashboardData.innerHTML = `
                                    <p><strong>Score Competencia:</strong> ${json.data.score_competencia}/100</p>
                                    <p><strong>Recomendaciones:</strong> ${json.data.recomendaciones_clave.join(', ')}</p>
                                    <p><strong>Hashtags:</strong> ${json.data.hashtags.join(' ')}</p>
                                `;
                            }

                            if (json.stage === 'imagen' && json.status === 'start') {
                                const card = document.createElement('div');
                                card.id = `card-${json.data.index}`;
                                card.className = 'bg-gray-900 border border-gray-800 rounded-xl overflow-hidden flex flex-col justify-between h-[400px] relative';
                                card.innerHTML = `
                                    <div class="absolute inset-0 skeleton flex items-center justify-center p-4 text-center text-xs text-gray-300">
                                        ✨ Generando fondo HD...
                                    </div>
                                    <div class="relative z-10 p-4 bg-black/60 backdrop-blur-sm h-full flex flex-col justify-between">
                                        <span class="text-[10px] uppercase tracking-wider text-purple-400 font-bold">${json.data.tipo}</span>
                                        <div>
                                            <h4 class="font-bold text-white text-sm mb-1">${json.data.titulo}</h4>
                                            <p class="text-xs text-gray-300">${json.data.descripcion}</p>
                                        </div>
                                    </div>
                                `;
                                carouselContainer.appendChild(card);
                            }

                            if (json.stage === 'imagen' && json.status === 'done') {
                                const card = document.getElementById(`card-${json.data.index}`);
                                if (card) {
                                    card.style.backgroundImage = `url('${json.data.image_url}')`;
                                    card.style.backgroundSize = 'cover';
                                    card.style.backgroundPosition = 'center';
                                    const skeleton = card.querySelector('.skeleton');
                                    if (skeleton) skeleton.remove();
                                }
                            }

                            if (json.stage === 'completo') {
                                statusContainer.classList.add('hidden');
                            }
                        } catch (err) {}
                    }
                }
            }
        });
    </script>
</body>
</html>
