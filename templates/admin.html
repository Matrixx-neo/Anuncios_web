<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - AdVance AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="flex justify-between items-center bg-slate-900 p-6 rounded-2xl border border-slate-800">
            <h1 class="text-2xl font-bold text-white">Panel Administrador</h1>
            <a href="/" class="text-indigo-400 hover:text-indigo-300">Volver a la App</a>
        </div>

        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
            <h2 class="text-lg font-bold text-white mb-4">Recargas Pendientes</h2>
            {% if txs|length == 0 %}
                <p class="text-slate-500 text-sm">No hay recargas pendientes.</p>
            {% else %}
                <div class="space-y-4">
                    {% for tx in txs %}
                    <div class="flex items-center justify-between bg-slate-800 p-4 rounded-xl border border-slate-700" id="tx-{{ tx.id }}">
                        <div>
                            <p class="font-bold text-white">{{ tx.user_email }}</p>
                            <p class="text-sm text-slate-400">{{ tx.method }} - S/ {{ tx.amount }}</p>
                            <p class="text-xs text-slate-500">{{ tx.created_at }}</p>
                        </div>
                        <div class="flex items-center gap-4">
                            <a href="{{ tx.receipt_path }}" target="_blank" class="text-sm text-indigo-400 hover:underline">Ver Voucher</a>
                            <button onclick="approve({{ tx.id }})" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-bold">Aprobar</button>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            {% endif %}
        </div>
    </div>

    <script>
        async function approve(id) {
            if(!confirm("¿Aprobar esta recarga y sumar créditos al usuario?")) return;
            const res = await fetch(`/api/approve_tx/${id}`, { method: 'POST' });
            const data = await res.json();
            if(data.success) {
                document.getElementById(`tx-${id}`).remove();
                alert("Créditos aprobados correctamente.");
            }
        }
    </script>
</body>
</html>
