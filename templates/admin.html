<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - AdVance AI</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <link href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)" rel="stylesheet">
    <style>
        body { background-color: #05070A; color: #f8fafc; font-family: sans-serif; }
        .glass-card { background: rgba(13, 17, 28, 0.85); border: 1px solid #1E293B; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center selection:bg-purple-500/30">
    <div class="w-full max-w-5xl space-y-8">
        
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 glass-card p-6 rounded-3xl shadow-[0_10px_40px_rgba(0,0,0,0.5)]">
            <h1 class="text-2xl font-black text-white flex items-center gap-3"><i class="fa-solid fa-shield-halved text-purple-500"></i> Panel de Administrador</h1>
            <a href="/" class="text-sm font-bold bg-[#05070A] text-purple-400 border border-[#1E293B] px-5 py-2.5 rounded-xl hover:text-white transition"><i class="fa-solid fa-arrow-left mr-2"></i> Volver al Studio</a>
        </div>
        
        <!-- ASIGNACIÓN DIRECTA MANUAL -->
        <div class="glass-card p-6 md:p-8 rounded-3xl shadow-xl border-t border-purple-500/20">
            <h2 class="text-sm font-bold uppercase tracking-widest text-slate-400 mb-5 flex items-center gap-2"><i class="fa-solid fa-hand-holding-dollar text-emerald-500"></i> Asignación Manual Directa</h2>
            <form id="manualAssignForm" class="flex flex-col md:flex-row gap-4">
                <input type="email" name="email" placeholder="Correo electrónico del usuario registrado" required class="flex-1 bg-[#05070A] border border-[#1E293B] rounded-xl p-4 text-sm text-white outline-none focus:border-purple-500">
                <select name="credits" class="w-full md:w-64 bg-[#05070A] border border-[#1E293B] rounded-xl p-4 text-sm text-white outline-none focus:border-purple-500">
                    <option value="3">Starter (+3 Créditos)</option>
                    <option value="12">Emprendedor (+12 Créditos)</option>
                    <option value="35">PRO Studio (+35 Créditos)</option>
                    <option value="100">Bono Especial (+100 Créditos)</option>
                </select>
                <button type="submit" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold px-8 py-4 rounded-xl transition uppercase tracking-widest text-sm shadow-[0_0_15px_rgba(147,51,234,0.3)]">Asignar Directo</button>
            </form>
        </div>

        <!-- VOUCHERS PENDIENTES -->
        <div class="glass-card p-6 md:p-8 rounded-3xl shadow-xl">
            <h2 class="text-sm font-bold uppercase tracking-widest text-slate-400 mb-5 flex items-center gap-2"><i class="fa-solid fa-file-invoice text-amber-500"></i> Vouchers Pendientes de Aprobación</h2>
            <div class="space-y-5">
                {% for tx in txs %}
                <div class="bg-[#05070A] p-6 rounded-2xl border border-[#1E293B] flex flex-col xl:flex-row justify-between items-center gap-6" id="tx-{{ tx.id }}">
                    <div class="flex items-center gap-4 w-full xl:w-auto">
                        <div class="w-12 h-12 bg-slate-900 rounded-full flex items-center justify-center text-slate-500 border border-slate-800">
                            <i class="fa-solid fa-user text-lg"></i>
                        </div>
                        <div>
                            <p class="font-bold text-white text-base">{{ tx.user_email }}</p>
                            <p class="text-[11px] text-slate-500 font-mono">{{ tx.created_at }}</p>
                        </div>
                    </div>
                    
                    <div class="flex flex-wrap items-center justify-center xl:justify-end gap-3 w-full xl:w-auto">
                        <a href="{{ tx.receipt_path }}" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-white px-5 py-3 rounded-xl text-xs font-bold transition flex items-center gap-2 border border-slate-700 w-full md:w-auto text-center justify-center">
                            <i class="fa-solid fa-image text-purple-400"></i> Ver Voucher
                        </a>
                        <button onclick="approve({{ tx.id }}, 3)" class="bg-[#0B0F19] hover:bg-slate-800 text-slate-300 hover:text-white px-5 py-3 rounded-xl text-xs font-bold transition border border-slate-700 w-full md:w-auto">
                            Starter (+3)
                        </button>
                        <button onclick="approve({{ tx.id }}, 12)" class="bg-purple-900/30 hover:bg-purple-600 text-purple-300 hover:text-white px-5 py-3 rounded-xl text-xs font-bold transition border border-purple-500/50 w-full md:w-auto shadow-[0_0_15px_rgba(168,85,247,0.1)]">
                            Emprendedor (+12)
                        </button>
                        <button onclick="approve({{ tx.id }}, 35)" class="bg-amber-900/30 hover:bg-amber-600 text-amber-500 hover:text-white px-5 py-3 rounded-xl text-xs font-bold transition border border-amber-500/50 w-full md:w-auto">
                            PRO (+35)
                        </button>
                    </div>
                </div>
                {% endfor %}
                
                {% if not txs %}
                <div class="text-center p-14 bg-[#05070A] rounded-3xl border border-[#1E293B] border-dashed">
                    <i class="fa-solid fa-clipboard-check text-5xl text-emerald-500/50 mb-4"></i>
                    <p class="text-slate-400 font-bold text-lg">Todo al día. No hay pagos pendientes.</p>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
    <script>
        async function approve(id, credits) {
            if(!confirm(`¿Confirmas que el voucher es real y quieres recargar ${credits} créditos a este usuario?`)) return;
            const formData = new FormData();
            formData.append('credits', credits);
            const res = await fetch(`/api/approve/${id}`, {method: 'POST', body: formData});
            if(res.ok) {
                document.getElementById(`tx-${id}`).remove();
                alert(`¡${credits} Créditos asignados con éxito!`);
            }
        }

        document.getElementById('manualAssignForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/admin/assign', { method: 'POST', body: new FormData(e.target) });
            if(res.ok) {
                alert("¡Créditos asignados directamente con éxito!");
                e.target.reset();
            } else {
                alert("Error al asignar créditos.");
            }
        });
    </script>
</body>
</html>
