<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - AdVance AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 p-6">
    <div class="max-w-3xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-xl font-bold">Vouchers Pendientes</h1>
            <a href="/" class="text-indigo-400">Volver</a>
        </div>
        <div class="space-y-4">
            {% for tx in txs %}
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center" id="tx-{{ tx.id }}">
                <div>
                    <p class="font-bold">{{ tx.user_email }}</p>
                    <p class="text-xs text-slate-500">{{ tx.created_at }}</p>
                </div>
                <div class="flex gap-3">
                    <a href="{{ tx.receipt_path }}" target="_blank" class="bg-slate-800 px-3 py-1.5 rounded text-sm">Ver Voucher</a>
                    <button onclick="approve({{ tx.id }})" class="bg-emerald-600 text-white px-3 py-1.5 rounded text-sm font-bold">Aprobar (+5 Cr)</button>
                </div>
            </div>
            {% endfor %}
            {% if not txs %}
            <p class="text-slate-500">No hay pagos pendientes.</p>
            {% endif %}
        </div>
    </div>
    <script>
        async function approve(id) {
            await fetch(`/api/approve/${id}`, {method: 'POST'});
            document.getElementById(`tx-${id}`).remove();
        }
    </script>
</body>
</html>
